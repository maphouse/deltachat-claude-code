# Owners: OpenPGP fingerprints of the Delta Chat profiles allowed to use the
# bot. A fingerprint names your key, not an address, so it keeps working
# whichever relays your profile uses. Leave empty on a fresh install: the
# first person to join through the invite link that provisioning prints
# becomes the owner (recorded in agentbot.db). To add more by hand, find a
# fingerprint in Delta Chat under the contact → Encryption, or in the bot's
# log when it ignores someone. Spaces are ignored.
admin_fingerprints = []

# Directories /new, /cd and /send accept. Not a sandbox: sessions run with
# bypassPermissions as the bot's Unix user and can touch whatever it can.
allowed_roots = ["/home/you"]

# Default working directory for new sessions.
default_cwd = "/home/you"

# Leave empty to let each project's .claude/settings*.json choose the model.
# Set a model name here to force one globally (e.g. "sonnet", "opus").
default_model = ""

# Permission mode for Claude Code sessions. "bypassPermissions" skips all
# confirmation prompts — only safe because admin_fingerprints (and /share) gate access.
default_permission_mode = "bypassPermissions"

# Max concurrent Claude Code subprocesses. Oldest idle session is evicted
# when this limit is reached.
max_live_sessions = 3

# Minutes of inactivity before a session subprocess is terminated.
# The session can still be resumed on the next message.
idle_timeout_min = 30

# Show tool calls and thinking in chat messages.
verbose_tools = true

# Preamble: the agentbot-wide system prompt, appended (via --append-system-prompt)
# to every session on top of Claude Code's own prompt and the cwd's CLAUDE.md.
# Each chat's own system prompt (/commission --system-prompt, /prompt) and its
# name/sharing status are added after it. Omit the key to use the built-in text.
# Claude Code keeps a conversation's system prompt from its first message, so
# edits reach a chat from its next /clear or /new (after a bot restart).
preamble = """
You are being used through agentbot: the user talks to you over Delta Chat (an encrypted messenger), often from a phone. Each of your text replies is sent as a chat message, so keep them concise; light markdown is fine but avoid wide tables and long code dumps unless asked.
Files the user sends are saved under .agentbot-inbox/ in the working directory and appear as [attached: <path>]; voice memos arrive already transcribed. You can't send files yourself — the user can fetch one with /send <path>.
The user may reset this conversation with /clear; anything that should outlive it belongs in files (e.g. the project's CLAUDE.md).
"""
